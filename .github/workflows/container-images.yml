name: Container Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/trading-service-boundaries
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kis-wrapper
            gradle_task: bootJar
            jar_dir: build/libs
            dockerfile: Dockerfile
            port: "8079"
          - image: stock-search-service
            gradle_task: :stock-search-service:bootJar
            jar_dir: stock-search-service/build/libs
            dockerfile: stock-search-service/Dockerfile
            port: "8082"
          - image: strategy-execution-service
            gradle_task: :strategy-execution-service:bootJar
            jar_dir: strategy-execution-service/build/libs
            dockerfile: strategy-execution-service/Dockerfile
            port: "8080"
          - image: stock-purchase-service
            gradle_task: :stock-purchase-service:bootJar
            jar_dir: stock-purchase-service/build/libs
            dockerfile: stock-purchase-service/Dockerfile
            port: "8083"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build boot jar
        run: ./gradlew --no-daemon ${{ matrix.gradle_task }}

      - name: Stage boot jar for Docker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ".docker/${{ matrix.image }}"
          jar_file="$(find "${{ matrix.jar_dir }}" -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          if [[ -z "${jar_file}" ]]; then
            echo "No executable boot jar found in ${{ matrix.jar_dir }}" >&2
            exit 1
          fi
          cp "${jar_file}" ".docker/${{ matrix.image }}/app.jar"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        shell: bash
        env:
          APP_PORT: ${{ matrix.port }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ matrix.image }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          output_args=(--push)
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            output_args=(--load)
          fi

          for attempt in 1 2 3; do
            if docker buildx build \
              --build-arg "JAR_FILE=.docker/${IMAGE}/app.jar" \
              --build-arg "APP_PORT=${APP_PORT}" \
              --file "${DOCKERFILE}" \
              --tag "ghcr.io/${REPOSITORY_OWNER}/sketch-${IMAGE}:${SHA}" \
              --tag "ghcr.io/${REPOSITORY_OWNER}/sketch-${IMAGE}:latest" \
              "${output_args[@]}" \
              .; then
              exit 0
            fi

            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi

            docker buildx prune --force || true
            sleep $((attempt * 10))
          done
