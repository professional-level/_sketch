syntax = "proto3";
import "google/protobuf/timestamp.proto";
message StrategySavedEvent{
  string stock_id = 1;
  string stock_name = 2;
  google.protobuf.Timestamp saved_at = 3;
  StrategyType type = 4;
  EventMeta meta = 5;
  string event_id = 6;
  string strategy_id = 7;
  string idempotency_key = 8;
  string strategy_version = 9;
  double decision_price = 10;
  double target_buy_price = 11;
  double budget = 12;
  string quantity_policy = 13;
}

message EventMeta{
  bytes id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string service_name = 3;
  //  meta 정보에 trace_id와 같은 요청의 정보를 넣고 싶은데...
  // 애플리케이션과 proto message를 동시에 아우를 수 있는 방법이 있을까
}

message OrderIntentCreatedEvent{
  string event_id = 1;
  string strategy_execution_id = 2;
  StrategyExecutionType strategy_type = 3;
  string symbol = 4;
  OrderIntentSide side = 5;
  OrderIntentOrderType order_type = 6;
  double price = 7;
  int64 quantity = 8;
  string order_tag = 9;
  string idempotency_key = 10;
  google.protobuf.Timestamp created_at = 11;
  EventMeta meta = 12;
  OrderTradingEnvironment trading_environment = 13;
}

message StrategyExecutionStartRequested {
  string event_id = 1;
  string idempotency_key = 2;
  StrategyExecutionType strategy_type = 3;
  string strategy_version = 4;
  string symbol = 5;
  string market = 6;
  double budget = 7;
  string source_service = 8;
  string source_signal_id = 9;
  google.protobuf.Timestamp requested_at = 10;
  StrategyExecutionParameters parameters = 11;
  EventMeta meta = 12;
}

message StrategyExecutionParameters {
  oneof value {
    LaorV4StartParameters laor_v4 = 1;
    FinalPriceBatingV1StartParameters final_price_bating_v1 = 2;
  }
}

message LaorV4StartParameters {
  int32 total_split_count = 1;
  double first_buy_limit_multiplier = 2;
  bool auto_restart = 3;
}

message FinalPriceBatingV1StartParameters {
  double target_buy_price = 1;
  double budget = 2;
  string quantity_policy = 3;
}

message OrderSubmitted {
  string event_id = 1;
  string strategy_execution_id = 2;
  string order_intent_id = 3;
  string broker_order_id = 4;
  google.protobuf.Timestamp submitted_at = 5;
  EventMeta meta = 6;
}

message OrderRejected {
  string event_id = 1;
  string strategy_execution_id = 2;
  string order_intent_id = 3;
  string broker_order_id = 4;
  string reason = 5;
  google.protobuf.Timestamp rejected_at = 6;
  EventMeta meta = 7;
}

message OrderCancelled {
  string event_id = 1;
  string strategy_execution_id = 2;
  string order_intent_id = 3;
  string broker_order_id = 4;
  string reason = 5;
  google.protobuf.Timestamp cancelled_at = 6;
  EventMeta meta = 7;
}

message OrderFilled {
  string event_id = 1;
  string strategy_execution_id = 2;
  string order_intent_id = 3;
  string broker_order_id = 4;
  OrderIntentSide side = 5;
  double filled_price = 6;
  int64 filled_quantity = 7;
  string order_tag = 8;
  google.protobuf.Timestamp filled_at = 9;
  EventMeta meta = 10;
}

message OrderPartiallyFilled {
  string event_id = 1;
  string strategy_execution_id = 2;
  string order_intent_id = 3;
  string broker_order_id = 4;
  OrderIntentSide side = 5;
  double filled_price = 6;
  int64 filled_quantity = 7;
  string order_tag = 8;
  google.protobuf.Timestamp filled_at = 9;
  EventMeta meta = 10;
}

enum StrategyType{
  UNDEFINED = 0;
  FINAL_PRICE_BATING_V1 = 1;
}

enum StrategyExecutionType{
  STRATEGY_EXECUTION_TYPE_UNDEFINED = 0;
  LAOR_V4_STRATEGY = 1;
  FINAL_PRICE_BATING_V1_STRATEGY = 2;
}

enum OrderIntentSide{
  ORDER_INTENT_SIDE_UNDEFINED = 0;
  ORDER_INTENT_BUY = 1;
  ORDER_INTENT_SELL = 2;
}

enum OrderIntentOrderType{
  ORDER_INTENT_ORDER_TYPE_UNDEFINED = 0;
  ORDER_INTENT_LOC = 1;
  ORDER_INTENT_MOC = 2;
  ORDER_INTENT_LIMIT = 3;
}

enum OrderTradingEnvironment{
  ORDER_TRADING_ENVIRONMENT_UNDEFINED = 0;
  ORDER_TRADING_ENVIRONMENT_MOCK = 1;
  ORDER_TRADING_ENVIRONMENT_LIVE = 2;
}
