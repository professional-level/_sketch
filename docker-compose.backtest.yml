services:
  yfinance-fetcher:
    build:
      context: ./backtest-service/scripts
      dockerfile: Dockerfile
    image: akra-backtest-yfinance-fetcher:local
    volumes:
      - ./backtest-service/data/yfinance:/data
    command:
      - --tickers
      - TQQQ
      - --start
      - "2024-01-01"
      - --end
      - "2024-02-01"
      - --output-dir
      - /data
