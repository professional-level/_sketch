apiVersion: v1
kind: Namespace
metadata:
  name: akra-trading
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akra-secret-sync
  namespace: akra-trading
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: akra-vault-secret-store
  namespace: akra-trading
spec:
  provider:
    vault:
      server: REPLACE_VAULT_SERVER_URL
      path: REPLACE_VAULT_KV_MOUNT
      version: v2
      auth:
        kubernetes:
          mountPath: REPLACE_VAULT_KUBERNETES_AUTH_MOUNT
          role: REPLACE_VAULT_KUBERNETES_ROLE
          serviceAccountRef:
            name: akra-secret-sync
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kis-broker-secrets
  namespace: akra-trading
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: akra-vault-secret-store
    kind: SecretStore
  target:
    name: kis-broker-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: app-key
      remoteRef:
        key: REPLACE_VAULT_KIS_SECRET_PATH
        property: app-key
    - secretKey: app-secret
      remoteRef:
        key: REPLACE_VAULT_KIS_SECRET_PATH
        property: app-secret
    - secretKey: mock-app-key
      remoteRef:
        key: REPLACE_VAULT_KIS_SECRET_PATH
        property: mock-app-key
    - secretKey: mock-app-secret
      remoteRef:
        key: REPLACE_VAULT_KIS_SECRET_PATH
        property: mock-app-secret
    - secretKey: account
      remoteRef:
        key: REPLACE_VAULT_KIS_SECRET_PATH
        property: account
    - secretKey: account-tail
      remoteRef:
        key: REPLACE_VAULT_KIS_SECRET_PATH
        property: account-tail
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trading-database-secrets
  namespace: akra-trading
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: akra-vault-secret-store
    kind: SecretStore
  target:
    name: trading-database-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: host
      remoteRef:
        key: REPLACE_VAULT_DATABASE_SECRET_PATH
        property: host
    - secretKey: port
      remoteRef:
        key: REPLACE_VAULT_DATABASE_SECRET_PATH
        property: port
    - secretKey: database
      remoteRef:
        key: REPLACE_VAULT_DATABASE_SECRET_PATH
        property: database
    - secretKey: username
      remoteRef:
        key: REPLACE_VAULT_DATABASE_SECRET_PATH
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE_VAULT_DATABASE_SECRET_PATH
        property: password
