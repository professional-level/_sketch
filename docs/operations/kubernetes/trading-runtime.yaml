apiVersion: v1
kind: Namespace
metadata:
  name: akra-trading
---
apiVersion: v1
kind: Secret
metadata:
  name: kis-broker-secrets
  namespace: akra-trading
type: Opaque
stringData:
  app-key: REPLACE_WITH_REAL_APP_KEY
  app-secret: REPLACE_WITH_REAL_APP_SECRET
  mock-app-key: REPLACE_WITH_MOCK_APP_KEY
  mock-app-secret: REPLACE_WITH_MOCK_APP_SECRET
  account: REPLACE_WITH_REAL_ACCOUNT
  account-tail: REPLACE_WITH_REAL_ACCOUNT_TAIL
---
apiVersion: v1
kind: Secret
metadata:
  name: trading-database-secrets
  namespace: akra-trading
type: Opaque
stringData:
  host: mysql.trading-infra.svc.cluster.local
  port: "3306"
  database: akra_trading
  username: akra_trading
  password: REPLACE_WITH_DATABASE_PASSWORD
---
apiVersion: v1
