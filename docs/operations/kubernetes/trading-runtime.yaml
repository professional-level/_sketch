    akra.order.overseas.mock=false
    akra.order.overseas.default-exchange=NASD
    akra.order.status-lookup.backfill-days=1
    akra.order.status-lookup.forward-days=1
    akra.order.execution-reconciliation.backfill-days=7
    akra.order.risk.enabled=true
    akra.order.risk.duplicate-order-kill-switch-enabled=true
    akra.order.risk.account-cash.enabled=true
    akra.order.risk.sell-position.enabled=true
    akra.order.risk.trading-hours.enabled=true
    akra.order.risk.max-order-notional=1000
    akra.order.risk.max-account-pending-buy-notional=5000
    akra.order.risk.max-account-exposure-notional=20000
    akra.order.risk.max-daily-order-count=20
    akra.order.risk.enabled-strategy-prefixes[0]=laor-v4-live
    akra.order.risk.symbol-max-order-notional.TQQQ=1000
    akra.order.risk.strategy-trading-environments[laor-v4-live]=LIVE
    akra.order.risk.strategy-trading-environments[laor-v4-paper]=MOCK
    akra.order.risk.currency-conversion.provider=static
    akra.order.risk.currency-conversion.base-currency=USD
    akra.order.risk.currency-conversion.domestic-currency=KRW
    akra.order.risk.currency-conversion.overseas-us-currency=USD
    akra.order.risk.currency-conversion.rates-to-base.KRW=0.00075
    akra.order.risk.trading-hours.domestic.regular-open=09:00
    akra.order.risk.trading-hours.domestic.regular-close=15:30
    akra.order.risk.trading-hours.overseas-us.regular-open=09:30
    akra.order.risk.trading-hours.overseas-us.regular-close=16:00
    akra.order.risk.trading-hours.overseas-us.default-us-equity-calendar-enabled=true
    akra.order.risk.trading-hours.overseas-us.early-close-time=13:00
    akra.order.risk.trading-hours.overseas-us.loc-cutoff=15:50
    akra.order.risk.trading-hours.overseas-us.moc-cutoff=15:50
    akra.runtime.safety.enabled=true
    akra.runtime.safety.allow-local-broker-endpoint-in-production=false
    akra.runtime.safety.allow-mock-trading-in-production=false
    akra.runtime.safety.allow-disabled-risk-controls-in-production=false
    akra.runtime.safety.allow-application-secret-property-source-in-production=false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: akra-trading-schema-migration
  namespace: akra-trading
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-migration
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: trading-database-secrets
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: trading-database-secrets
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: trading-database-secrets
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: trading-database-secrets
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-database-secrets
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              for file in /migrations/*.sql; do
                echo "applying ${file}"
                mysql --protocol=TCP -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" < "${file}"
              done
          volumeMounts:
            - name: sql-migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: sql-migrations
          configMap:
            name: akra-sql-migrations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kis-wrapper
  namespace: akra-trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kis-wrapper
  template:
    metadata:
      labels:
        app: kis-wrapper
    spec:
      containers:
        - name: app
          image: ghcr.io/professional-level/_sketch/kis-wrapper:REPLACE_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8079
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/akra/config/
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-database-secrets
                  key: password
            - name: KIS_APP_KEY_FILE
              value: /run/secrets/kis/app-key
            - name: KIS_APP_SECRET_FILE
              value: /run/secrets/kis/app-secret
            - name: KIS_MOCK_APP_KEY_FILE
              value: /run/secrets/kis/mock-app-key
            - name: KIS_MOCK_APP_SECRET_FILE
              value: /run/secrets/kis/mock-app-secret
            - name: KIS_ACCOUNT_FILE
              value: /run/secrets/kis/account
            - name: KIS_ACCOUNT_TAIL_FILE
              value: /run/secrets/kis/account-tail
          readinessProbe:
            tcpSocket:
              port: 8079
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8079
            periodSeconds: 30
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/akra/config/application-prod.properties
              subPath: kis-wrapper.application-prod.properties
              readOnly: true
            - name: kis-secrets
              mountPath: /run/secrets/kis
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: akra-trading-runtime-config
        - name: kis-secrets
          secret:
            secretName: kis-broker-secrets
---
