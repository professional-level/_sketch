    spring.datasource.url=jdbc:mysql://mysql.trading-infra.svc.cluster.local:3306/akra_trading?useSSL=true&serverTimezone=UTC
    spring.datasource.username=akra_trading
    spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
    spring.jpa.hibernate.ddl-auto=validate
    akra.runtime.safety.enabled=true
    akra.runtime.safety.allow-file-token-persistence-in-production=false
    akra.runtime.safety.allow-application-secret-property-source-in-production=false
    akra.kis.token.persistence.enabled=true
    akra.kis.token.persistence.type=jdbc
    akra.kis.token.persistence.lock-ttl=30s
    akra.kis.token.persistence.lock-wait-timeout=10s
    akra.kis.token.persistence.lock-retry-delay=100ms
  stock-search.application-prod.properties: |
    server.port=8082
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.datasource.url=jdbc:mysql://mysql.trading-infra.svc.cluster.local:3306/akra_trading?useSSL=true&serverTimezone=UTC
    spring.datasource.username=akra_trading
    spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
    spring.jpa.hibernate.ddl-auto=validate
    spring.kafka.bootstrap-servers=kafka-0.kafka.trading-infra.svc.cluster.local:9092,kafka-1.kafka.trading-infra.svc.cluster.local:9092,kafka-2.kafka.trading-infra.svc.cluster.local:9092
    akra.temporal.enabled=true
    akra.temporal.target=temporal-frontend.trading-infra.svc.cluster.local:7233
    akra.temporal.namespace=default
    akra.temporal.task-queue=stock-search-scheduler
    akra.runtime.safety.enabled=true
    akra.runtime.safety.allow-local-temporal-target-in-production=false
    akra.runtime.safety.allow-application-secret-property-source-in-production=false
  strategy-execution.application-prod.properties: |
    server.port=8080
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.datasource.url=jdbc:mysql://mysql.trading-infra.svc.cluster.local:3306/akra_trading?useSSL=true&serverTimezone=UTC
    spring.datasource.username=akra_trading
    spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
    spring.jpa.hibernate.ddl-auto=validate
    spring.kafka.bootstrap-servers=kafka-0.kafka.trading-infra.svc.cluster.local:9092,kafka-1.kafka.trading-infra.svc.cluster.local:9092,kafka-2.kafka.trading-infra.svc.cluster.local:9092
    management.endpoints.web.exposure.include=health,info,metrics,prometheus
    management.endpoint.health.probes.enabled=true
    management.metrics.tags.application=strategy-execution-service
    akra.temporal.enabled=true
    akra.temporal.target=temporal-frontend.trading-infra.svc.cluster.local:7233
    akra.temporal.namespace=default
    akra.temporal.task-queue=strategy-execution-scheduler
    akra.market-data.kis-open-api.base-url=http://kis-wrapper.akra-trading.svc.cluster.local:8079
    akra.order-intent.default-trading-environment=LIVE
    akra.order-intent.strategy-trading-environments[laor-v4-live]=LIVE
    akra.order-intent.strategy-trading-environments[laor-v4-paper]=MOCK
    akra.trading-calendar.us.enabled=true
    akra.trading-calendar.us.zone-id=America/New_York
    akra.trading-calendar.us.default-us-equity-calendar-enabled=true
    akra.trading-calendar.us.regular-open=09:30
    akra.trading-calendar.us.regular-close=16:00
    akra.runtime.safety.enabled=true
    akra.runtime.safety.allow-local-temporal-target-in-production=false
    akra.runtime.safety.allow-local-market-data-endpoint-in-production=false
    akra.runtime.safety.allow-mock-order-intent-in-production=false
    akra.runtime.safety.allow-disabled-trading-calendar-in-production=false
    akra.runtime.safety.allow-application-secret-property-source-in-production=false
  stock-purchase.application-prod.properties: |
    server.port=8083
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.datasource.url=jdbc:mysql://mysql.trading-infra.svc.cluster.local:3306/akra_trading?useSSL=true&serverTimezone=UTC
    spring.datasource.username=akra_trading
    spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
    spring.jpa.hibernate.ddl-auto=validate
    spring.kafka.bootstrap-servers=kafka-0.kafka.trading-infra.svc.cluster.local:9092,kafka-1.kafka.trading-infra.svc.cluster.local:9092,kafka-2.kafka.trading-infra.svc.cluster.local:9092
