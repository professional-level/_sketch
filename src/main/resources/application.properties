server.port=8079
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
akra.kis.token.refresh-before-expiry=10m
akra.kis.token.fallback-ttl=23h
akra.kis.token.persistence.enabled=false
akra.kis.token.persistence.type=file
# Defaults to ${user.home}/.akra/kis-token-cache.json when enabled and no file is set.
# akra.kis.token.persistence.file=
# Applies only when akra.kis.token.persistence.type=jdbc.
akra.kis.token.persistence.lock-ttl=30s
akra.kis.token.persistence.lock-wait-timeout=10s
akra.kis.token.persistence.lock-retry-delay=100ms

# Toss Securities Open API proxy. Credentials belong in application-secret.properties or env vars.
akra.openapi.toss.base-url=https://openapi.tossinvest.com
akra.openapi.toss.paths.token=/oauth2/token
# Fill operation paths from the official Toss OpenAPI JSON before enabling calls below.
# akra.openapi.toss.paths.account=
# akra.openapi.toss.paths.stock-snapshot=
# akra.openapi.toss.paths.stock-balance=
# akra.openapi.toss.paths.buy-order=
# akra.openapi.toss.paths.sell-order=
# akra.openapi.toss.paths.buy-order-simulation=
# akra.openapi.toss.paths.sell-order-simulation=
