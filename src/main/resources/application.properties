server.port=8079
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
akra.kis.token.refresh-before-expiry=10m
akra.kis.token.fallback-ttl=23h
akra.kis.token.persistence.enabled=false
akra.kis.token.persistence.type=file
# Defaults to ${user.home}/.akra/kis-token-cache.json when enabled and no file is set.
# akra.kis.token.persistence.file=
# Applies only when akra.kis.token.persistence.type=jdbc.
akra.kis.token.persistence.lock-ttl=30s
akra.kis.token.persistence.lock-wait-timeout=10s
akra.kis.token.persistence.lock-retry-delay=100ms

# Toss Securities Open API proxy. Credentials belong in application-secret.properties or env vars.
akra.openapi.toss.base-url=https://openapi.tossinvest.com
akra.openapi.toss.token.refresh-before-expiry=10m
akra.openapi.toss.token.fallback-ttl=55m
akra.openapi.toss.paths.token=/oauth2/token
akra.openapi.toss.paths.account=/api/v1/accounts
# Internal stock snapshot proxy maps to Toss stock info lookup.
akra.openapi.toss.paths.stock-snapshot=/api/v1/stocks
akra.openapi.toss.paths.stock-balance=/api/v1/holdings
# Toss order creation uses one endpoint for both BUY and SELL. The side stays in the JSON payload.
akra.openapi.toss.paths.buy-order=/api/v1/orders
akra.openapi.toss.paths.sell-order=/api/v1/orders
# Toss official docs do not expose order simulation endpoints as of 2026-07-08.
# Leave these blank unless Toss publishes dedicated simulation APIs or a separate proxy is introduced.
# akra.openapi.toss.paths.buy-order-simulation=
# akra.openapi.toss.paths.sell-order-simulation=
