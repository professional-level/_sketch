spring.application.name=stock-purchase-service
server.port=8083
spring.profiles.include=kafka
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
akra.order.kis-open-api.base-url=http://localhost:8079
akra.order.kis-open-api.resilience.request-timeout=5s
akra.order.kis-open-api.resilience.query-max-attempts=3
akra.order.kis-open-api.resilience.query-backoff=200ms
akra.order.kis-open-api.resilience.rate-limit.enabled=true
akra.order.kis-open-api.resilience.rate-limit.max-requests-per-second=5
akra.order.kis-open-api.resilience.rate-limit.max-wait=2s
akra.order.kis-open-api.resilience.circuit-breaker.enabled=true
akra.order.kis-open-api.resilience.circuit-breaker.failure-threshold=5
akra.order.kis-open-api.resilience.circuit-breaker.open-duration=30s
akra.order.domestic.mock=true
akra.order.overseas.mock=true
akra.runtime.safety.enabled=true
akra.runtime.safety.allow-local-broker-endpoint-in-production=false
akra.runtime.safety.allow-mock-trading-in-production=false
akra.order.risk.enabled=true
akra.order.risk.duplicate-order-kill-switch-enabled=true
# akra.order.risk.max-order-notional=1000
# akra.order.risk.max-account-pending-buy-notional=5000
# akra.order.risk.max-daily-order-count=20
# akra.order.risk.disabled-strategy-prefixes[0]=laor-v4:TQQQ
