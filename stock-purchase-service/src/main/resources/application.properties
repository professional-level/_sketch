spring.application.name=stock-purchase-service
server.port=8083
spring.profiles.include=kafka
akra.order.kis-open-api.base-url=http://localhost:8079
akra.order.kis-open-api.resilience.request-timeout=5s
akra.order.kis-open-api.resilience.query-max-attempts=3
akra.order.kis-open-api.resilience.query-backoff=200ms
akra.order.domestic.mock=true
akra.order.overseas.mock=true
akra.runtime.safety.enabled=true
akra.runtime.safety.allow-local-broker-endpoint-in-production=false
akra.runtime.safety.allow-mock-trading-in-production=false
akra.order.risk.enabled=true
akra.order.risk.duplicate-order-kill-switch-enabled=true
