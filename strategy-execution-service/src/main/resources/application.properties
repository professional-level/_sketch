spring.application.name=strategy-execution-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
akra.temporal.enabled=true
akra.temporal.target=127.0.0.1:7233
akra.temporal.namespace=default
akra.temporal.task-queue=strategy-execution-scheduler
akra.temporal.schedules.active-executions.enabled=true
akra.temporal.schedules.active-executions.schedule-id=strategy-execution-active-executions-daily
akra.temporal.schedules.active-executions.hour=9
akra.temporal.schedules.active-executions.minute=30
akra.temporal.schedules.active-executions.second=0
akra.temporal.schedules.active-executions.time-zone=America/New_York
akra.temporal.schedules.active-executions.weekdays-only=true
akra.temporal.schedules.active-executions.execution-run-id-prefix=ACTIVE_STRATEGIES_DAILY
akra.order-intent.default-trading-environment=MOCK
# akra.order-intent.strategy-trading-environments[laor-v4-live]=LIVE
# akra.order-intent.strategy-trading-environments[laor-v4-paper]=MOCK
akra.trading-calendar.us.enabled=true
akra.trading-calendar.us.zone-id=America/New_York
akra.trading-calendar.us.weekdays-only=true
akra.trading-calendar.us.regular-open=09:30
akra.trading-calendar.us.regular-close=16:00
akra.trading-calendar.us.default-us-equity-calendar-enabled=true
# Configure yyyy-MM-dd values from the broker or exchange calendar before operating with real capital.
# akra.trading-calendar.us.holidays[0]=2026-07-03
# akra.trading-calendar.us.early-close-days[0]=2026-11-27
# akra.trading-calendar.us.early-close-time=13:00
# akra.trading-calendar.us.early-close-times[2026-11-27]=12:30
akra.market-data.kis-open-api.base-url=http://localhost:8079
akra.runtime.safety.enabled=true
akra.runtime.safety.allow-local-temporal-target-in-production=false
akra.runtime.safety.allow-local-market-data-endpoint-in-production=false
akra.runtime.safety.allow-mock-order-intent-in-production=false
akra.runtime.safety.allow-disabled-trading-calendar-in-production=false
akra.runtime.safety.allow-application-secret-property-source-in-production=false
